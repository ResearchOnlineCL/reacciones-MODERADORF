<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Reacciones</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 15px; color: #333; margin: 0; }
    .app-container { max-width: 480px; margin: 0 auto; background: #ffffff; padding: 15px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    video { width: 100%; border-radius: 12px; pointer-events: none; display: block; }
    .emoji-bar { display: flex; justify-content: space-between; gap: 6px; margin-top: 15px; }
    .card-btn { background: #ffffff; border: 2px solid #e0e0e0; border-radius: 12px; width: 18%; padding: 10px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s, border-color 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .card-btn:active { transform: scale(1.08); background: #f0f4f8; border-color: #0088cc; }
    .emoji { font-size: 22px; margin-bottom: 4px; display: block; }
    .label { font-size: 9.5px; color: #333; font-weight: bold; text-align: center; line-height: 1.1; }
    #nameModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: white; padding: 25px; border-radius: 16px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .modal-box input { width: 90%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 8px; margin-bottom: 12px; outline: none; }
    .modal-box button { background: #0088cc; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
  </style>
</head>
<body>

  <div id="nameModal">
    <div class="modal-box">
      <h3 id="modalTitle">Identifícate</h3>
      <p id="modalDesc" style="font-size: 14px; color: #666; margin-bottom: 15px;">Ingresa tus datos para continuar:</p>
      
      <div id="inputGroup">
        <input type="text" id="firstNameInput" placeholder="Nombre">
        <input type="text" id="lastNameInput" placeholder="Apellido">
      </div>
      
      <button id="modalBtn" onclick="submitName()">Comenzar Video</button>
    </div>
  </div>

  <div class="app-container">
    <h3 style="margin-top: 0; font-size: 14px; color: #444; line-height: 1.3; text-align: left;">
      Ve el video y marca los emoji. Dinos lo que sientas en todo momento, en un cambio de escena, entrada de un personaje o simplemente confirmanos tu sentimiento apretando el mismo emoji.
    </h3>
    
    <video id="myVideo" playsinline webkit-playsinline preload="auto" muted>
      <source src="PEGA_AQUI_TU_ENLACE_DE_DROPBOX_CON_RAW=1" type="video/mp4">
      Tu navegador no soporta el reproductor.
    </video>

    <div class="emoji-bar">
      <button class="card-btn" onclick="sendReaction('🔥 Me engancha')">
        <span class="emoji">🔥</span>
        <span class="label">Me engancha</span>
      </button>
      <button class="card-btn" onclick="sendReaction('🥱 Me aburre')">
        <span class="emoji">🥱</span>
        <span class="label">Me aburre</span>
      </button>
      <button class="card-btn" onclick="sendReaction('😂 Me hace reír')">
        <span class="emoji">😂</span>
        <span class="label">Me hace reír</span>
      </button>
      <button class="card-btn" onclick="sendReaction('🥹 Me emociona')">
        <span class="emoji">🥹</span>
        <span class="label">Me emociona</span>
      </button>
      <button class="card-btn" onclick="sendReaction('😱 Me impacta')">
        <span class="emoji">😱</span>
        <span class="label">Me impacta</span>
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    const SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT";
    const video = document.getElementById('myVideo');
    
    let user = localStorage.getItem('userName') || "Anónimo";
    let maxTimeWatched = parseFloat(localStorage.getItem('videoProgress')) || 0;
    let started = false;

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('userName');
      if (savedUser) {
        user = savedUser;
        document.getElementById('modalTitle').innerText = "¡Hola, " + user + "!";
        document.getElementById('modalDesc').innerText = "Haz clic para continuar viendo el video donde lo dejaste:";
        document.getElementById('inputGroup').style.display = 'none';
        document.getElementById('modalBtn').innerText = "Continuar Video";
      }
    });

    function submitName() {
      const savedUser = localStorage.getItem('userName');
      
      if (!savedUser) {
        const firstName = document.getElementById('firstNameInput').value.trim();
        const lastName = document.getElementById('lastNameInput').value.trim();
        
        if (firstName && lastName) {
          user = firstName + " " + lastName;
          localStorage.setItem('userName', user);
        } else {
          alert("Por favor completa tu nombre y apellido.");
          return;
        }
      }
      
      document.getElementById('nameModal').style.display = 'none';
      
      // Desactivar silencio justo cuando el usuario hace clic para iniciar
      video.muted = false;
      
      if (maxTimeWatched > 0) {
        video.currentTime = maxTimeWatched;
      }
      
      video.play().catch(e => {
        console.log("Reintentando reproducción...", e);
        // Fallback para reproducir si el navegador exige inicio con interacción directa
        setTimeout(() => { video.play(); }, 300);
      });
    }

    video.onplay = () => {
      if (!started) {
        started = true;
        sendData({ user: user, event: "Inicio de reproduccion", timestamp: formatStringTime(maxTimeWatched) });
      }
    };

    video.addEventListener('pause', () => {
      if (!video.ended && started) {
        video.play();
      }
    });

    video.addEventListener('timeupdate', () => {
      if (!started) return;
      
      if (video.currentTime > maxTimeWatched) {
        maxTimeWatched = video.currentTime;
        localStorage.setItem('videoProgress', maxTimeWatched);
      }
      
      const diff = video.currentTime - maxTimeWatched;
      if (diff > 1.5 || video.currentTime < maxTimeWatched) {
        video.currentTime = maxTimeWatched;
      }
    });

    function formatStringTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function sendReaction(reactionText) {
      const currentTimeFormatted = formatStringTime(video.currentTime);
      sendData({
        user: user,
        event: "Reaccion Emoji",
        emoji: reactionText,
        timestamp: currentTimeFormatted
      });
    }

    function sendData(data) {
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(data)
      });
    }
  </script>
</body>
</html>
